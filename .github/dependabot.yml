version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, time: "05:00", timezone: Europe/Berlin }
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]
  # Also updates `uses: osloer-industries/.github/.github/workflows/...@<sha>` reusable workflow refs.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "05:30", timezone: Europe/Berlin }
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
