name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    uses: osloer-industries/.github/.github/workflows/release-please.yml@4ca4cc7336b5b34d02a724e8a7aed245cf1ffae4 # v0.1.0
    permissions:
      contents: write
      issues: write
      pull-requests: write
    secrets:
      RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
