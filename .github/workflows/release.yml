name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    uses: osloer-industries/.github/.github/workflows/release-please.yml@a081e1b87b5309ff2b3999e8d6804d8ebec5c518 # v0.1.1
    permissions:
      contents: write
      issues: write
      pull-requests: write
    secrets:
      RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
