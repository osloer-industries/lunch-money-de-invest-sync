name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    uses: osloer-industries/.github/.github/workflows/release-please.yml@a081e1b87b5309ff2b3999e8d6804d8ebec5c518 # v0.1.1
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    with:
      release-app-id: ${{ vars.OSLOER_RELEASE_APP_ID }}
      release-app-owner: osloer-industries
      release-app-repositories: lunch-money-de-invest-sync