name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    uses: osloer-industries/.github/.github/workflows/release-please.yml@0221b21f9d130eff47cb04ca9374220886198419 # main
    permissions:
      contents: write
      issues: write
      pull-requests: write
    secrets:
      RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
