name: Scheduled sync

# Only useful once you have a Scalable Capital proxy (see README) reachable from this
# runner and a config.json reconstructed from the SYNC_CONFIG_JSON secret below. Trade
# Republic's login is interactive (blocks on an SMS code), so it can't run unattended here
# — see README's "Trade Republic: running the sync" section.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Write config.json from secret
        run: echo "$SYNC_CONFIG_JSON" > config.json
        env:
          SYNC_CONFIG_JSON: ${{ secrets.SYNC_CONFIG_JSON }}
      - run: pnpm sync
        env:
          LUNCH_MONEY_API_KEY: ${{ secrets.LUNCH_MONEY_API_KEY }}
