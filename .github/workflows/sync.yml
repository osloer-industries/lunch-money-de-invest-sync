name: Scheduled sync

# Only useful once you have a Scalable Capital proxy (see README) reachable from this
# runner and a config.json reconstructed from the SYNC_CONFIG_JSON secret below. Trade
# Republic's login is interactive (blocks on an SMS code), so it can't run unattended here
# — see README's "Trade Republic: running the sync" section.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

concurrency:
  group: scheduled-sync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run sync or skip when secrets are missing
        env:
          LUNCH_MONEY_API_KEY: ${{ secrets.LUNCH_MONEY_API_KEY }}
          SYNC_CONFIG_JSON: ${{ secrets.SYNC_CONFIG_JSON }}
        run: |
          if [ -z "$SYNC_CONFIG_JSON" ] || [ -z "$LUNCH_MONEY_API_KEY" ]; then
            echo "Scheduled sync skipped: set SYNC_CONFIG_JSON and LUNCH_MONEY_API_KEY repository secrets to enable."
            exit 0
          fi
          umask 077
          printf '%s\n' "$SYNC_CONFIG_JSON" > config.json
          chmod 600 config.json
          npm run sync
