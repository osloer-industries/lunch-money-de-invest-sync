name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-security:
    uses: osloer-industries/.github/.github/workflows/workflow-security.yml@2359eb885c7c2ef7a2cb966348076392809b0f03 # v0.1.5
    permissions:
      contents: read
      actions: read

  quality:
    uses: osloer-industries/.github/.github/workflows/node-npm-quality.yml@2359eb885c7c2ef7a2cb966348076392809b0f03 # v0.1.5
    permissions:
      contents: read

  test-macos:
    name: Tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run test

  test-europe-berlin:
    name: Tests (TZ=Europe/Berlin)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Europe/Berlin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run test

  e2e-linux:
    name: E2E terminal (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm rebuild node-pty
      - run: npm run test:e2e

  e2e-macos:
    name: E2E terminal (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      TZ: America/Los_Angeles
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm rebuild node-pty
      - run: npm run test:e2e

  e2e-berlin:
    name: E2E terminal (TZ=Europe/Berlin)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Europe/Berlin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm rebuild node-pty
      - run: npm run test:e2e

  codeql:
    uses: osloer-industries/.github/.github/workflows/codeql-javascript-typescript.yml@2359eb885c7c2ef7a2cb966348076392809b0f03 # v0.1.5
    permissions:
      contents: read
      actions: read
      security-events: write

  sonar-analyze:
    uses: osloer-industries/.github/.github/workflows/sonarqube-cloud-node.yml@2359eb885c7c2ef7a2cb966348076392809b0f03 # v0.1.5
    permissions:
      contents: read
      pull-requests: read
    with:
      coverage-npm-script: test:coverage
      timeout-minutes: 20
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  sonar-zero-open-issues:
    if: github.event_name == 'pull_request'
    needs: sonar-analyze
    uses: osloer-industries/.github/.github/workflows/sonarcloud-zero-issues.yml@2359eb885c7c2ef7a2cb966348076392809b0f03 # v0.1.5
    with:
      project-key: osloer-industries_lunch-money-de-invest-sync
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  ci-passed:
    name: ci-passed
    needs:
      - workflow-security
      - quality
      - test-macos
      - test-europe-berlin
      - e2e-linux
      - e2e-macos
      - e2e-berlin
      - codeql
      - sonar-analyze
      - sonar-zero-open-issues
    if: always()
    uses: osloer-industries/.github/.github/workflows/ci-passed.yml@2359eb885c7c2ef7a2cb966348076392809b0f03 # v0.1.5
    with:
      needs-json: ${{ toJSON(needs) }}