name: CodeQL
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
permissions:
  contents: read
  actions: read
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    uses: osloer-industries/.github/.github/workflows/codeql-javascript-typescript.yml@f8af0b286b1bd58abd92d08fa10ee61e60910e42 # .github PR #5 head (TypeScript gate)
    with:
      code-scanning-upload: false
      queries: security-and-quality
