name: CodeQL
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    uses: osloer-industries/.github/.github/workflows/codeql-javascript-typescript.yml@65dc7ba5e001dc552cada5a8d2aa88be7f425638 # main
    permissions:
      contents: read
      actions: read
    with:
      code-scanning-upload: false
      fail-on-sarif-level: error
      queries: security-and-quality
