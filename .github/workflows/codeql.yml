name: CodeQL
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    uses: osloer-industries/.github/.github/workflows/codeql-javascript-typescript.yml@4ca4cc7336b5b34d02a724e8a7aed245cf1ffae4 # v0.1.0
    permissions:
      contents: read
      actions: read
    with:
      code-scanning-upload: false
      fail-on-sarif-level: error
      queries: security-and-quality
