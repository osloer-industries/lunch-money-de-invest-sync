name: CodeQL
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    uses: osloer-industries/.github/.github/workflows/codeql-javascript-typescript.yml@a081e1b87b5309ff2b3999e8d6804d8ebec5c518 # v0.1.1
    permissions:
      contents: read
      actions: read
    with:
      code-scanning-upload: false
      fail-on-sarif-level: error
      queries: security-and-quality
