name: SonarCloud

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: sonarcloud-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zero-open-issues:
    uses: osloer-industries/.github/.github/workflows/sonarcloud-zero-issues.yml@4ca4cc7336b5b34d02a724e8a7aed245cf1ffae4 # v0.1.0
    with:
      project-key: osloer-industries_lunch-money-de-invest-sync
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}