name: SonarCloud

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: sonarcloud-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zero-open-issues:
    uses: osloer-industries/.github/.github/workflows/sonarcloud-zero-issues.yml@eb1884c861aed5f39259adf8d02db11c2a196051 # main
    with:
      project-key: osloer-industries_lunch-money-de-invest-sync
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}