name: SonarCloud

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: sonarcloud-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zero-open-issues:
    uses: osloer-industries/.github/.github/workflows/sonarcloud-zero-issues.yml@0221b21f9d130eff47cb04ca9374220886198419 # main
    with:
      project-key: osloer-industries_lunch-money-de-invest-sync
      reusables-ref: 0221b21f9d130eff47cb04ca9374220886198419
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}