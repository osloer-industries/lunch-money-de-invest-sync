name: SonarCloud

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: sonarcloud-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zero-open-issues:
    uses: osloer-industries/.github/.github/workflows/sonarcloud-zero-issues.yml@a081e1b87b5309ff2b3999e8d6804d8ebec5c518 # v0.1.1
    with:
      project-key: osloer-industries_lunch-money-de-invest-sync
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}